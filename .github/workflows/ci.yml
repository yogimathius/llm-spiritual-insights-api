name: Perspective Loom CI

on:
  push:
    branches: ["main", "modernize/**"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: |
          ruff check .

      - name: Check Python formatting and types
        run: |
          ruff format --check .
          mypy ai_app ai_project

      - name: Run dependency security audit
        run: |
          pip-audit -r requirements.txt

      - name: Run database migrations
        env:
          DJANGO_SECRET_KEY: "ci-test-secret-key-not-used-in-production"
          DJANGO_DEBUG: "False"
          DEFAULT_MODEL_PROVIDER: "fake"
        run: |
          python manage.py migrate --noinput
          python manage.py initialize_llm_roles

      - name: Run Django & Engine test suite
        env:
          DJANGO_SECRET_KEY: "ci-test-secret-key-not-used-in-production"
          DJANGO_DEBUG: "False"
          DEFAULT_MODEL_PROVIDER: "fake"
        run: |
          python manage.py makemigrations --check --dry-run
          pytest --cov=ai_app --cov-branch --cov-report=term:skip-covered --cov-fail-under=80

      - name: Execute reproducible evaluation benchmark
        env:
          DJANGO_SECRET_KEY: "ci-test-secret-key-not-used-in-production"
          DJANGO_DEBUG: "False"
          DEFAULT_MODEL_PROVIDER: "fake"
        run: |
          python manage.py run_evaluation --output /tmp/eval_report.json
